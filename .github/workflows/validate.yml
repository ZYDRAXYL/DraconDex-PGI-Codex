# Catches the manifest mistakes that would otherwise only surface as a failed
# install inside DraconDex. No dependencies to install — the validator is plain
# Node, and `node --check` just parses the plugin's own scripts.
name: Validate plugin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # tools/plugin-manifest.cjs is DraconDex-EXE's own plugin-manifest.js,
      # vendored at the release pinned in plugin-contract.lock.json — so the
      # next step is the app's verdict, not a re-typed copy of its rules.
      - name: Vendored plugin contract is untouched
        run: node tools/plugin-contract.mjs
      - name: Validate manifest (the app's own rules)
        run: node tools/validate-manifest.mjs
      # Every script the manifest ships, not just the entry — a parse error in
      # any of them is a plugin that installs fine and then does nothing.
      - name: Parse plugin scripts
        run: |
          for f in app.js panel.js src/*.js; do
            echo "checking $f"
            node --check "$f"
          done
      # Drives src/provider.js against canned SSE — the Responses-API event
      # mapping is the part a manifest check can't see.
      - name: Run tests
        run: node --test test/*.test.mjs
      # Advisory: says when DraconDex-EXE moved its contract past our pin.
      - name: Has the plugin contract moved upstream?
        run: node tools/plugin-contract.mjs --upstream
        continue-on-error: true
