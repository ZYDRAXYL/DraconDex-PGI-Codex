<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Codex Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="window-mode">
  <!-- Standalone-window entry (Settings → Plugin → Launch). Plugin windows are
       frameless (createPluginWindow in DraconDex-EXE's electron/ main.js sets
       frame:false), so the page draws its own title bar. .titlebar is the drag
       region; anything clickable inside it needs .no-drag or the drag region
       swallows the click. The side-panel entry is panel.html, which shares
       every script below and only differs in this chrome. -->
  <header class="titlebar">
    <span class="title">Codex Chat</span>
    <button id="close-btn" class="no-drag icon-btn" title="Close">&#x2715;</button>
  </header>

  <p id="offline" class="notice" hidden>
    Running outside DraconDex — <code>window.pluginApi</code> is missing, so
    there is nowhere to store conversations. Install this plugin from the app
    to use it.
  </p>

  <main id="root"></main>

  <script src="src/store.js"></script>
  <script src="src/provider.js"></script>
  <script src="src/catalog.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/chat.js"></script>
  <script src="app.js"></script>
</body>
</html>
